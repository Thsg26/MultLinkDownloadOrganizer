[package]
name = "mldo"
version = "0.7.0"
edition = "2021"
description = "Multi Link Download Organizer — organizador desktop de downloads"
license = "MIT"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
encoding_rs = "0.8"
futures-util = "0.3"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "cookies"] }
rfd = "0.15"
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
tokio-util = "0.7"
url = "2"

[target.'cfg(windows)'.dependencies]
tao = "0.37"
wry = { version = "0.57", default-features = false, features = ["os-webview"] }

[profile.release]
lto = "thin"
strip = true
